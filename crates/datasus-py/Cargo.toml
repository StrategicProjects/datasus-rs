[package]
name = "datasus-py"
description = "Python bindings for the DATASUS DBC/DBF reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
datasus-core.workspace = true
datasus-arrow.workspace = true
arrow-array = { version = "60", features = ["ffi"] }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
